<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device inventory</title>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#17212f;background:#fff;--muted:#465467;--surface:#fff;--border:#728197;--notice:#edf3fc;--success:#14532d;--error:#991b1b}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;color:#f1f5f9;background:#161d29;--muted:#cbd5e1;--surface:#202b3b;--border:#94a3b8;--notice:#25374f;--success:#bbf7d0;--error:#fecaca}}
*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:560px;margin:auto}h2{font-size:20px;margin:0 0 8px}p{line-height:1.5}.muted{font-size:13px;color:var(--muted)}
dl{display:grid;grid-template-columns:90px 1fr;gap:8px;margin:20px 0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}label{display:block;font-size:14px;margin-top:14px}
input,select{width:100%;font:inherit;padding:11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:inherit;margin-top:6px}input::placeholder{color:var(--muted);opacity:1}button{font:inherit;font-weight:600;width:100%;padding:12px;border:0;border-radius:9px;color:#fff;background:#145ac2;margin-top:20px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#status{min-height:48px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--notice);overflow-wrap:anywhere}#status[data-state="success"]{color:var(--success)}#status[data-state="error"]{color:var(--error)}[hidden]{display:none!important}
fieldset{border:1px solid var(--border);border-radius:10px;padding:16px;margin:18px 0}legend{padding:0 6px}.remove{float:right;width:40px;height:40px;margin:0;padding:9px;background:transparent;color:var(--error);border:1px solid var(--border)}.remove svg{width:20px;height:20px}
</style>
<main><h2>Device inventory</h2><p class="muted">Save device details and credentials to the local devices.yaml inventory. Passwords are stored in clear text in this local file.</p>
<p id="status" role="status" aria-live="polite">Loading device inventory…</p>
<form id="form" hidden><div id="devices"></div>
<button id="add" type="button">Add device</button>
<button id="save" type="submit">Save inventory</button></form></main>
<script>
(() => {
  'use strict';
  const el=id=>document.getElementById(id);
  const send=(method,params,id)=>window.parent.postMessage({jsonrpc:'2.0',method,params,...(id===undefined?{}:{id})},'*');
  const status=(text,state='info')=>{el('status').textContent=text;el('status').dataset.state=state};
  let rows=[], savedNames=new Set(), deletedNames=new Set(), rowNames=new WeakMap(), initialized=false, loaded=false, pending=false, timer=null;
  function resize(){send('ui/notifications/size-changed',{width:560,height:document.body.scrollHeight})}
  function addRow(value={}){
    const group=document.createElement('fieldset');
    const legend=document.createElement('legend');legend.textContent='Device '+(rows.length+1);group.appendChild(legend);
    const inputs={};rowNames.set(inputs,value.device_name||null);
    const remove=document.createElement('button');remove.type='button';remove.className='remove';
    remove.title='Delete device';remove.setAttribute('aria-label','Delete '+(value.device_name||'device'));
    remove.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>';
    remove.addEventListener('click',()=>{if(pending)return;const name=rowNames.get(inputs);if(savedNames.has(name))deletedNames.add(name);rows=rows.filter(row=>row!==inputs);group.remove();resize()});
    group.appendChild(remove);
    for(const [key,label,type,defaultValue] of [
      ['device_name','Device Name','text',''],['hostname','Hostname/IP Address','text',''],
      ['https_port','HTTPS port','number',443],['ssh_port','SSH port','number',22],
      ['username','Username','text',''],['password','Password','password','']]){
      const wrapper=document.createElement('label');wrapper.textContent=label;
      const input=document.createElement('input');input.type=type;input.required=!['username','password'].includes(key);input.value=value[key]??defaultValue;
      if(type==='number'){input.min='1';input.max='65535';input.step='1'}
      else{input.maxLength=key==='device_name'?64:['username','password'].includes(key)?4096:253}
      if(key==='username')input.autocomplete='username';
      if(key==='password'){input.autocomplete='new-password';input.placeholder=value.has_account?'Saved password (leave blank to keep)':'Enter password'}
      wrapper.appendChild(input);group.appendChild(wrapper);inputs[key]=input;
    }
    el('devices').appendChild(group);rows.push(inputs);resize();
  }
  function data(result){
    if(result?.structuredContent)return result.structuredContent;
    try{return JSON.parse(result?.content?.find(c=>c.type==='text')?.text||'{}')}catch{return {}}
  }
  function accept(result){
    const value=data(result);
    if(loaded || value.status!=='edit_device_inventory')return;
    loaded=true;for(const row of value.devices||[]){savedNames.add(row.device_name);addRow(row)}
    if(!rows.length)addRow();el('form').hidden=false;status('Edit device details, then save the inventory.');resize();
  }
  function busy(value){
    pending=value;el('save').disabled=value;el('add').disabled=value;
    for(const row of rows)for(const input of Object.values(row))input.disabled=value;
    for(const button of el('devices').querySelectorAll('button'))button.disabled=value;
  }
  window.addEventListener('message',event=>{
    if(event.source!==window.parent || event.data?.jsonrpc!=='2.0')return;
    const message=event.data;
    if(message.id===1 && message.result && !initialized){
      initialized=true;send('ui/notifications/initialized',{});
      if(!loaded)send('tools/call',{name:'device_inventory',arguments:{}},10);
    }
    if(message.id===10){
      const value=data(message.result);
      if(message.error || message.result?.isError || value.error)status(value.error?.message||'Could not load inventory. Reopen the form.','error');
      else accept(message.result);
    }
    if(message.id===11){
      clearTimeout(timer);busy(false);const value=data(message.result);
      if(!message.error && !message.result?.isError && value.status==='inventory_saved'){
        savedNames=new Set((value.devices||rows.map(row=>({device_name:row.device_name.value.trim()}))).map(row=>row.device_name));deletedNames.clear();
        for(const row of rows)rowNames.set(row,row.device_name.value.trim());
        for(const row of rows){if(row.password.value)row.password.placeholder='Saved password (leave blank to keep)';row.password.value=''}
        status('Device inventory saved to devices.yaml.','success');
        send('ui/update-model-context',{content:[{type:'text',text:'Device inventory saved to local devices.yaml. No device connection was attempted.'}]},12);
      }else status(value.error?.message||'Could not save inventory. Check the details and retry.','error');
    }
    if(message.method==='ui/notifications/tool-result')accept(message.params);
    if(message.method==='ui/resource-teardown'){clearTimeout(timer);window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*')}
  });
  el('add').addEventListener('click',()=>addRow());
  el('form').addEventListener('submit',event=>{
    event.preventDefault();if(pending)return;
    const devices=rows.map(row=>Object.fromEntries(Object.entries(row).map(([key,input])=>[key,key.endsWith('_port')?Number(input.value):key==='password'?input.value:input.value.trim()])));
    busy(true);status('Saving inventory…');
    const names=new Set(devices.map(row=>row.device_name));
    const deleted_devices=[...deletedNames].filter(name=>!names.has(name));
    send('tools/call',{name:'save_device_inventory',arguments:{devices,deleted_devices}},11);
    timer=setTimeout(()=>{busy(false);status('Save status is unknown. Reopen inventory to check saved values before retrying.','error')},20000);
  });
  send('ui/initialize',{appInfo:{name:'Device inventory',version:'0.3.9'},appCapabilities:{},protocolVersion:'2026-01-26'},1);
  const initial=window.openai?.toolResponseMetadata;
  if(initial)accept(initial.call_tool_result||initial.mcp_tool_result||initial);
})();
</script></html>
