[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "secure-firewall-assistant"
version = "0.3.8"
description = "Local, schema-driven Cisco Secure Firewall tools for ChatGPT Work"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.26,<5",
  "paramiko>=5.1,<6",
  "platformdirs>=4.13,<5",
  "filelock>=3.20,<4",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[project.scripts]
secure-firewall-assistant = "secure_firewall_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_firewall_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
